site_name: 御AgentISOlation (Oaiso)
site_description: 御AgentISOlation（Oaiso）— AIエージェントの隔離実行基盤。コマンドは oaiso。
site_url: https://pacificbelt30.github.io/sandbox-oasis/
repo_name: pacificbelt30/sandbox-oasis
repo_url: https://github.com/pacificbelt30/sandbox-oasis

docs_dir: doc

theme:
  name: material
  language: ja
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy

plugins:
  - search:
      lang:
        - ja
        - en

nav:
  - ホーム: index.md
  - はじめに:
      - 概要と用語: concepts.md
      - インストール: installation.md
      - クイックスタート: getting-started.md
      - リリース情報: release-notes.md
  - 利用ガイド:
      - 概要: guides/index.md
      - 導入から初回起動: guides/first-run.md
      - エージェント:
          - 起動方法と対応状況: guides/agents.md
          - Claude Code: claude-code.md
      - ファイル共有とworktree: workspace.md
      - 認証:
          - 認証方式とプロファイル: guides/authentication.md
          - 暗号化して保存する: guides/encrypted-credentials.md
          - キーリングを使う: guides/keyring.md
          - 認証プロキシ: auth-proxy.md
          - 短命トークン: auth-proxy/tokens.md
          - プロキシの単体利用: proxy-standalone.md
      - 通信と隔離:
