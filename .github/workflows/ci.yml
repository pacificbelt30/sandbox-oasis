name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0
          args: --timeout=5m

  # ── Build ───────────────────────────────────────────────────────────────
  build:
    permissions:
      contents: read
      id-token: write
      attestations: write
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"

      - name: Prepare managed Python
        run: uv python install 3.12

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: |
          go build -v -o oaiso .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o codex-dock-worker-guard ./cmd/worker-guard
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o codex-dock-io-logger ./cmd/io-logger

      - name: Verify binary runs
        run: |
          ./oaiso --help
          uv run --no-project --no-config --managed-python --python 3.12 python scripts/verify-cli-names.py --binary ./oaiso

      - name: Build installable node bundle
        run: |
          make node-bundle VERSION=v0.0.0-ci
          uv run --no-project --no-config --managed-python --python 3.12 python scripts/package-release.py --require-clean-source --bundle dist/node-bundle --output dist/release --version v0.0.0-ci
          cd dist/release
          sha256sum --check SHA256SUMS

      - name: Exercise real signing on main (never a release)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ci_provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/release/oaiso-linux-amd64.tar.gz
          create-storage-record: false

      - name: Verify signature, tamper rejection and signer constraints
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.ci_provenance.outputs.bundle-path }}
        run: |
          args=(--bundle "$ATTESTATION_BUNDLE" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --deny-self-hosted-runners)
          gh attestation verify dist/release/oaiso-linux-amd64.tar.gz "${args[@]}"
          cp dist/release/oaiso-linux-amd64.tar.gz /tmp/tampered-oaiso.tar.gz
          printf altered >> /tmp/tampered-oaiso.tar.gz
          if gh attestation verify /tmp/tampered-oaiso.tar.gz "${args[@]}"; then exit 1; fi
          if gh attestation verify dist/release/oaiso-linux-amd64.tar.gz "${args[@]}" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"; then exit 1; fi
          if gh attestation verify dist/release/oaiso-linux-amd64.tar.gz "${args[@]}" --source-ref refs/tags/v0.0.0-ci; then exit 1; fi

      - name: Cross-compile (macOS arm64)
        run: GOOS=darwin GOARCH=arm64 go build -o oaiso-darwin-arm64 .

      - name: Cross-compile (macOS amd64)
        run: GOOS=darwin GOARCH=amd64 go build -o oaiso-darwin-amd64 .

      - name: Cross-compile (Linux arm64)
        run: GOOS=linux GOARCH=arm64 go build -o oaiso-linux-arm64 .

  # ── Test ────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"

      - name: Prepare managed Python
        run: uv python install 3.12

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test Kata profile and transactional setup
        run: uv run --no-project --no-config --managed-python --python 3.12 python -m unittest discover -s deploy/kata -p 'test_*.py'

      - name: Test install script
        run: uv run --no-project --no-config --managed-python --python 3.12 python -m unittest discover -s scripts -p 'test_*.py'

      - name: Validate reviewed upstream contracts (offline)
        run: uv run --no-project --no-config --managed-python --python 3.12 python scripts/upstream-contracts.py validate-baseline

      - name: Run tests
        run: |
          make test

      - name: Fuzz security boundaries (offline, bounded)
        run: make security-fuzz

      - name: Show coverage summary
        run: go tool cover -func=coverage.out

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  # ── Vet ─────────────────────────────────────────────────────────────────
  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # ── Docker build ─────────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build sandbox image
        uses: docker/build-push-action@v6
        with:
          context: docker/sandbox
          file: docker/sandbox/Dockerfile
          push: false
          tags: codex-dock:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build auth proxy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/proxy/Dockerfile
          push: false
          tags: codex-dock-proxy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  local-sdk:
    name: Local API and SDK contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install SDK build tools
        working-directory: sdk/typescript
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check generated contract and TypeScript types
        run: |
          go run ./api/generate
          git diff --exit-code -- api/local-v1/schema.json sdk/typescript/src/types.ts
      - name: Run both SDKs against the Go adapter (offline)
        run: |
          go test -c -o /tmp/oaiso-local-api.test ./pkg/cxd/localapi
          uv run --no-project --no-config --managed-python --python 3.12 python scripts/verify-local-sdks.py --fixture /tmp/oaiso-local-api.test
      - name: Verify Python distribution imports
        run: |
          uv build sdk/python --wheel --out-dir /tmp/oaiso-sdk-wheels
          uv venv --python 3.12 /tmp/oaiso-sdk-python
          uv pip install --python /tmp/oaiso-sdk-python/bin/python /tmp/oaiso-sdk-wheels/*.whl
          /tmp/oaiso-sdk-python/bin/python -c 'from oaiso import Client, APIError; print("SDK import OK")'
      - name: Verify JavaScript distribution imports
        run: |
          npm pack ./sdk/typescript --ignore-scripts --pack-destination /tmp
          npm install --prefix /tmp/oaiso-sdk-js --ignore-scripts --no-audit --no-fund /tmp/oaiso-local-0.1.0.tgz
          node --input-type=module -e 'import { Client, APIError } from "/tmp/oaiso-sdk-js/node_modules/@oaiso/local/dist/index.js"; console.log("SDK import OK")'
