name: Upstream static contracts

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      codex_version:
        description: Codex npm version or dist-tag to inspect
        default: latest
      claude_version:
        description: Claude Code npm version or dist-tag to inspect
        default: latest

permissions:
  contents: read

concurrency:
  group: upstream-static-contracts
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"

      - name: Prepare managed Python
        run: uv python install 3.12

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install schema reader and test static rules
        run: |
          uv run --no-project --no-config --managed-python --python 3.12 \
            --with-requirements requirements-contracts.txt python -m unittest discover -s scripts -p 'test_*upstream*.py'
          uv run --no-project --no-config --managed-python --python 3.12 \
            --with-requirements requirements-contracts.txt python scripts/upstream-contracts.py validate-baseline

      - name: Stage official candidate CLIs without lifecycle scripts
        env:
          CODEX_CANDIDATE: ${{ inputs.codex_version || 'latest' }}
          CLAUDE_CANDIDATE: ${{ inputs.claude_version || 'latest' }}
        run: |
          npm install --prefix "$RUNNER_TEMP/agent-cli" --ignore-scripts --no-audit --no-fund \
            "@openai/codex@$CODEX_CANDIDATE" "@anthropic-ai/claude-code@$CLAUDE_CANDIDATE"
          # Native Claude releases use this installer to select the platform binary.
          # This only modifies the disposable runner's staged package directory.
          installer="$RUNNER_TEMP/agent-cli/node_modules/@anthropic-ai/claude-code/install.cjs"
          if [ -f "$installer" ]; then node "$installer"; fi

      - name: Capture declarations without login or inference
        id: capture
        continue-on-error: true
        run: |
          uv run --no-project --no-config --managed-python --python 3.12 \
            --with-requirements requirements-contracts.txt python scripts/upstream-contracts.py capture \
            --codex "$RUNNER_TEMP/agent-cli/node_modules/.bin/codex" \
            --claude "$RUNNER_TEMP/agent-cli/node_modules/.bin/claude" \
            --out "$RUNNER_TEMP/contracts/candidate.json"

      - name: Cache verified baseline references
        id: references
        uses: actions/cache/restore@v4
        with:
          path: .kata-verification/upstream-contract-cache
          key: ${{ runner.os }}-contract-reference-${{ hashFiles('compat/upstream/baseline.json', 'compat/upstream/manifest.json', 'scripts/upstream-contracts.py') }}

      - name: Compare with reviewed baseline
        id: compare
        if: always() && steps.capture.outcome != 'skipped'
        run: |
          uv run --no-project --no-config --managed-python --python 3.12 \
            --with-requirements requirements-contracts.txt python scripts/upstream-contracts.py compare \
            --candidate "$RUNNER_TEMP/contracts/candidate.json" \
            --json "$RUNNER_TEMP/contracts/report.json" \
            --markdown "$RUNNER_TEMP/contracts/report.md"

      - name: Prepare candidate runtime qualification plan
        if: always() && steps.capture.outcome == 'success'
        continue-on-error: true
        run: |
          uv run --no-project --no-config --managed-python --python 3.12 \
            --with-requirements requirements-contracts.txt python scripts/qualify-upstream.py plan \
            --candidate "$RUNNER_TEMP/contracts/candidate.json" \
            --out .kata-verification/upstream-qualification-plan

      - name: Publish run summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/contracts/report.md" ]; then
            cat "$RUNNER_TEMP/contracts/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Static inspection did not complete; compatibility is unknown.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save verified references even when changes need review
        if: always() && steps.references.outcome == 'success' && steps.references.outputs.cache-hit != 'true' && hashFiles('.kata-verification/upstream-contract-cache/*.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .kata-verification/upstream-contract-cache
          key: ${{ steps.references.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-static-contracts
          path: |
            ${{ runner.temp }}/contracts/
            .kata-verification/upstream-qualification-plan/
          if-no-files-found: warn
          retention-days: 30
