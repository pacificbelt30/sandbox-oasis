name: Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string
      publish:
        description: Publish after uploading all assets
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"

      - name: Prepare Python
        run: uv python install 3.12

      - name: Verify release source
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$(head -n 1 doc/release-notes.md)" = "# Oaiso $RELEASE_TAG"
          bash -n install.sh scripts/install.sh
          make test vet
          uv run --no-project --no-config --managed-python --python 3.12 python -m unittest discover -s scripts -p 'test_*.py'
          uv run --no-project --no-config --managed-python --python 3.12 python -m unittest discover -s deploy/kata -p 'test_*.py'

      - name: Build and package
        run: |
          make node-bundle VERSION="$RELEASE_TAG"
          uv run --no-project --no-config --managed-python --python 3.12 python scripts/package-release.py --require-clean-source --bundle dist/node-bundle --output dist/release --version "$RELEASE_TAG"
          cd dist/release
          sha256sum --check SHA256SUMS

      - name: Sign release provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/release/oaiso-linux-amd64.tar.gz
            dist/release/install.sh
            dist/release/SHA256SUMS
            dist/release/sbom.cdx.json
          create-storage-record: false

      - name: Save portable signature evidence
        env:
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp -- "$ATTESTATION_BUNDLE" dist/release/provenance.json

      - name: Verify signed artifacts before upload
        env:
          GH_CONFIG_DIR: ${{ runner.temp }}/oaiso-gh-verify
        run: |
          unset GH_TOKEN GITHUB_TOKEN GH_ENTERPRISE_TOKEN GITHUB_ENTERPRISE_TOKEN
          mkdir -m 700 -- "$GH_CONFIG_DIR"
          for asset in oaiso-linux-amd64.tar.gz install.sh SHA256SUMS sbom.cdx.json; do
            gh attestation verify "dist/release/$asset" --bundle dist/release/provenance.json --repo "$GITHUB_REPOSITORY" --source-ref "refs/tags/$RELEASE_TAG" --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$RELEASE_TAG" --cert-oidc-issuer https://token.actions.githubusercontent.com --source-digest "$GITHUB_SHA" --deny-self-hosted-runners --hostname github.com
          done

      - name: Upload complete release, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > /tmp/oaiso-release-state.json 2>/dev/null; then
            uv run --no-project --no-config --managed-python --python 3.12 python -c 'import json; assert json.load(open("/tmp/oaiso-release-state.json"))["isDraft"], "published releases must not be overwritten"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Oaiso $RELEASE_TAG" --notes-file doc/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/release/oaiso-linux-amd64.tar.gz dist/release/install.sh dist/release/SHA256SUMS dist/release/sbom.cdx.json dist/release/provenance.json --clobber
          if [ "$PUBLISH" = true ]; then
            release_base=${RELEASE_TAG%%+*}
            case "$release_base" in
              *-*) gh release edit "$RELEASE_TAG" --draft=false --prerelease ;;
              *) gh release edit "$RELEASE_TAG" --draft=false --latest ;;
            esac
          fi
